<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Route Planner - Road Cycling</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🚴 Bike Route Planner</h1>
            <div class="header-controls">
                <button id="currentLocationBtn" class="location-btn">📍 Current Location</button>
            </div>
        </header>
        
        <main class="main-content">
            <div class="sidebar">
                <div class="route-controls">
                    <h2>Plan Your Route</h2>
                    
                    <div class="input-group">
                        <label>Start Point</label>
                        <div class="input-with-buttons">
                            <input type="text" id="startInput" placeholder="Enter California address or use Current Location" />
                            <button id="startLocationBtn" class="location-btn">📍 Get Location</button>
                        </div>
                    </div>
                    
                    <div class="waypoints-section">
                        <div class="waypoints-header">
                            <label>Waypoints</label>
                            <span id="waypointCounter" class="waypoint-counter">Waypoints: 0</span>
                        </div>
                        <div id="waypointsList" class="waypoints-list"></div>
                        <button id="addWaypointBtn" class="add-waypoint-btn">+ Add Waypoint</button>
                    </div>
                    
                    <div class="input-group">
                        <label>End Point</label>
                        <div class="input-with-buttons">
                            <input type="text" id="endInput" placeholder="Enter California address or click on map" />
                            <button id="endLocationBtn" class="location-btn">📍 Get Location</button>
                        </div>
                    </div>
                    
                    <div class="route-options">
                        <label class="checkbox-container">
                            <input type="checkbox" id="returnToStart">
                            <span class="checkmark"></span>
                            Return to Start (Round Trip)
                        </label>
                        
                        <label class="unit-toggle">
                            <input type="checkbox" id="useImperialUnits" checked>
                            <span class="checkmark"></span>
                            Use Imperial Units (miles, feet)
                        </label>
                        
                        <div class="route-type-selector">
                            <label for="routeType">Route Type:</label>
                            <select id="routeType" class="route-type-select">
                                <option value="drive">🛣️ Road (Paved Only)</option>
                                <option value="cycling">🚵 MTB (Trails Prioritized)</option>
                                <option value="foot">🚶 Walking</option>
                            </select>
                            <div class="route-type-info">
                                <small>💡 Tip: MTB profile may provide more detailed street names</small>
                            </div>
                            <div class="api-selector">
                                <label for="routingApi">Routing API:</label>
                                <select id="routingApi" class="api-select">
                                    <option value="osrm">🆓 OSRM (Free)</option>
                                    <option value="mapbox">🗺️ Mapbox (Free Tier)</option>
                                    <option value="valhalla">🛣️ Valhalla (Free)</option>
                                    <option value="graphhopper">🚶 GraphHopper (Free)</option>
                                    <option value="openrouteservice">🌍 OpenRouteService (Free)</option>
                                </select>
                                <div class="api-info">
                                    <small id="apiStatus">🆓 Using OSRM (Free)</small>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button id="generateRouteBtn" class="generate-btn">🚴 Generate Route</button>
                        <button id="clearRouteBtn" class="clear-btn">🗑️ Clear Route</button>
                    </div>
                </div>
                
                <div class="route-info" id="routeInfo" style="display: none;">
                    <!-- Route information will be displayed here -->
                </div>
                
                <div class="elevation-profile" id="elevationProfile" style="display: none;">
                    <!-- Elevation profile will be displayed here -->
                </div>
                
                <div class="turn-directions" id="turnDirections" style="display: none;">
                    <!-- Turn-by-turn directions will be displayed here -->
                </div>
            </div>
            
            <div class="map-container">
                <div id="map"></div>
            </div>
        </main>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js?v=2.0.2"></script>
</body>
</html>
